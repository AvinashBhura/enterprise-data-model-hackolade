# Proposes updates to pinned GitHub Actions (full commit hashes), the CLI base
# image and the Python dependency (spec 0006, resolved question 1).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
