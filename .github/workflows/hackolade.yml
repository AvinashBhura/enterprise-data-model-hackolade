name: Hackolade

# Stale gate, schema gate, DDL smoke test and change report (spec 0006,
# requirements 2, 4 and 6). Runs the Hackolade CLI in Docker (ci/Dockerfile) and
# needs a concurrent licence in the HACKOLADE_LICENSE secret. Without it the job
# reports "skipped: no licence" and passes; modellers run the same steps locally
# with make hk-stale, make hk-validate and make hk-diff.

on:
  pull_request:
    branches: [main]
    paths: ["src/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  hackolade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HK: docker compose -f ci/compose.yml run --rm hck
      HAS_LICENCE: ${{ secrets.HACKOLADE_LICENSE != '' }}
    steps:
      - name: Licence present?
        if: env.HAS_LICENCE != 'true'
        run: |
          echo "skipped: no licence (HACKOLADE_LICENSE secret is not set)"
          echo "### Hackolade stage skipped: no licence" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`make hk-stale\`, \`make hk-validate\` and \`make hk-diff\` locally before merging." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: env.HAS_LICENCE == 'true'
        with:
          fetch-depth: 0
      - name: Build the CLI image and check its plugins
        if: env.HAS_LICENCE == 'true'
        run: |
          docker compose -f ci/compose.yml build
          $HK version | tee build-version.txt
          python3 ci/check_plugins.py ci/plugins.txt < build-version.txt
      - name: Validate the licence
        if: env.HAS_LICENCE == 'true'
        env:
          HACKOLADE_LICENSE: ${{ secrets.HACKOLADE_LICENSE }}
        run: $HK validateKey --key="$HACKOLADE_LICENSE" --identifier="github-${{ github.run_id }}" --logLevel=1
      - name: Changed models
        if: env.HAS_LICENCE == 'true'
        id: changed
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/**/*.hck.json' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Stale gate
        if: env.HAS_LICENCE == 'true' && steps.changed.outputs.files != ''
        run: ci/hk.sh stale ${{ steps.changed.outputs.files }}
      - name: Schema gate
        if: env.HAS_LICENCE == 'true'
        run: ci/hk.sh validate
      - name: DDL smoke test on PostgreSQL 16
        if: env.HAS_LICENCE == 'true'
        env:
          PGPASSWORD: ci-only
        run: |
          shopt -s globstar nullglob
          for f in build/ddl/**/*.sql; do
            echo "running $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Change report
        if: env.HAS_LICENCE == 'true' && steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/hk.sh diff "origin/${{ github.base_ref }}" ${{ steps.changed.outputs.files }}
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build/diff/report.md
