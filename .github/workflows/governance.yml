name: Governance

# Python checks and the spec gate. Needs no Hackolade licence (spec 0006, requirement 1).

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"
      - name: Test the checks
        run: make test
      - name: Run the governance checks
        run: make check
      - name: Spec gate
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python ci/spec_gate.py --title "$PR_TITLE" --base "origin/$BASE_REF"
